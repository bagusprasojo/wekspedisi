{% extends "base.html" %}

{% block title %}{{ title }}{% endblock %}
{% block page_title %}{{ title }}{% endblock %}

{% block content %}
<form class="max-w-lg rounded border bg-white p-5" method="post">
    {% csrf_token %}
    {% if form.errors %}
    <div class="mb-4 rounded border border-red-200 bg-red-50 px-3 py-2 text-sm text-red-700">
        {{ form.non_field_errors }}
    </div>
    {% endif %}
    <p class="text-sm">Hapus data <strong>{{ object }}</strong>?</p>
    <div class="mt-5 flex gap-2">
        <button class="rounded bg-red-700 px-4 py-2 text-sm text-white hover:bg-red-600" type="submit">Hapus</button>
        <a class="rounded border px-4 py-2 text-sm hover:bg-slate-100" href="{{ cancel_url }}">Batal</a>
    </div>
</form>
{% endblock %}
