{% if form.non_field_errors %}
<div class="mb-4 rounded border border-amber-300 bg-amber-50 px-4 py-3 text-sm text-amber-900">
    <p class="font-semibold">Periksa input</p>
    <div class="mt-1 leading-relaxed">{{ form.non_field_errors }}</div>
</div>
{% endif %}
{% for hidden in form.hidden_fields %}
    {{ hidden }}
    {% if hidden.errors %}
    <div class="mb-4 rounded border border-amber-300 bg-amber-50 px-4 py-3 text-sm text-amber-900">
        <p class="font-semibold">{{ hidden.label }}</p>
        <div class="mt-1 leading-relaxed">{{ hidden.errors|join:", " }}</div>
    </div>
    {% endif %}
{% endfor %}
